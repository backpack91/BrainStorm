<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>하치의 발음 검문소 — HACHIRO</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#1e2a38; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; overscroll-behavior:none; touch-action:none; }
  #wrap { position:relative; width:100%; height:100%; display:flex; flex-direction:column; }
  canvas { display:block; width:100%; flex:1; touch-action:none; }
  #panel { background:#f5efe0; padding:12px 14px 18px; border-top:4px solid #1e2a38; }
  #target { text-align:center; margin-bottom:4px; }
  #target .kr { font-size:22px; font-weight:900; color:#1e2a38; }
  #target .en { font-size:28px; font-weight:900; color:#c8503c; letter-spacing:1px; }
  #heard { text-align:center; min-height:22px; font-size:14px; font-weight:700; color:#5b7fa6; margin-bottom:8px; }
  #micBtn { display:block; width:100%; height:74px; border:none; border-radius:18px; background:#c8503c; color:#fff; font-size:20px; font-weight:900; box-shadow:0 4px 0 #93392a; }
  #micBtn.listening { background:#3a9b5c; box-shadow:0 4px 0 #26693d; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.02); } }
  #typeRow { display:none; gap:8px; margin-top:8px; }
  #typeRow input { flex:1; height:52px; border:2.5px solid #1e2a38; border-radius:12px; font-size:17px; padding:0 12px; font-weight:700; }
  #typeRow button { width:90px; border:none; border-radius:12px; background:#1e2a38; color:#fff; font-weight:900; font-size:16px; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(30,42,56,.88); color:#f5efe0; text-align:center; padding:24px; z-index:5; }
  #overlay h1 { font-size:26px; font-weight:900; margin-bottom:10px; }
  #overlay .sub { font-size:14px; opacity:.9; margin-bottom:20px; line-height:1.8; }
  #overlay .big { font-size:42px; font-weight:900; color:#f0a83c; margin:4px 0; }
  #btn { background:#f0a83c; color:#1e2a38; font-size:17px; font-weight:900; border:none; padding:14px 42px; border-radius:14px; box-shadow:0 4px 0 #b87c1f; }
  #btn:active { transform:translateY(3px); box-shadow:0 1px 0 #b87c1f; }
  .hidden { display:none !important; }
  .warn { font-size:12px; opacity:.75; margin-top:10px; line-height:1.6; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="panel">
    <div id="target"><span class="kr">-</span><br><span class="en">-</span></div>
    <div id="heard"></div>
    <button id="micBtn">🎤 누르고 발음하기</button>
    <div id="typeRow">
      <input id="typeInput" placeholder="영어 발음을 입력하세요 (예: buta don)" autocomplete="off">
      <button id="typeGo">통과!</button>
    </div>
  </div>
  <div id="overlay">
    <h1>🎤 하치의 발음 검문소</h1>
    <div class="sub">
      컨베이어벨트 위 돈부리가 검문 게이트로 갑니다.<br>
      메뉴 이름을 <b>영어 발음</b>으로 정확히 말해야 게이트가 열립니다!<br>
      📷 카메라를 허용하면 화면 가득 내 얼굴 + <b>얼굴을 따라다니는 필터</b>!<br>
      (화면을 톡 누르면 필터 변경 · 🎙️ 듣는 동안엔 벨트가 거의 멈춰요)
    </div>
    <div id="resultBox" class="hidden">
      <div id="failMsg" style="font-size:14px;margin-bottom:6px;line-height:1.6;"></div>
      <div class="big" id="finalScore">0개 통과</div>
    </div>
    <button id="btn">검문 시작</button>
    <div class="warn" id="micWarn"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
<script>
(() => {
  const cv=document.getElementById('game');
  const ctx=cv.getContext('2d');
  const overlay=document.getElementById('overlay');
  const btn=document.getElementById('btn');
  const micBtn=document.getElementById('micBtn');
  const heardEl=document.getElementById('heard');
  const targetKr=document.querySelector('#target .kr');
  const targetEn=document.querySelector('#target .en');
  const resultBox=document.getElementById('resultBox');
  const finalEl=document.getElementById('finalScore');
  const failEl=document.getElementById('failMsg');
  const micWarn=document.getElementById('micWarn');
  const typeRow=document.getElementById('typeRow');
  const typeInput=document.getElementById('typeInput');
  const typeGo=document.getElementById('typeGo');

  let W,H,scale;
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const rect=cv.getBoundingClientRect();
    W=rect.width; H=rect.height;
    cv.width=W*dpr; cv.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    scale=Math.min(W,520)/420;
  }
  window.addEventListener('resize',()=>setTimeout(resize,50));
  document.addEventListener('touchmove',e=>{ if(e.target.tagName!=='INPUT') e.preventDefault(); },{passive:false});

  // ---------- 메뉴 (영어 발음 + 허용 변형) ----------
  const MENUS=[
    { kr:'부타동', en:'BUTA DON', accept:['buta don','butadon','boota don','buda don','puta don','bta don','buta','pota don'] },
    { kr:'규동', en:'GYU DON', accept:['gyu don','gyudon','gyoo don','q don','cue don','kyu don','gew don','you don','yu don','giudon','judon','gudon','gyeo don','gyu','que don','kew don','g don','gyu tone'] },
    { kr:'에비동', en:'EBI DON', accept:['ebi don','ebidon','abby don','ebby don','evie don','abbey don','abi don','eb don','every don'] },
    { kr:'치즈카츠동', en:'CHEESE KATSU DON', accept:['cheese katsu don','cheese cutscene','cheese katsudon','cheese cat sudan','cheese catsu don','chees katsu don','cheese kats don','cheese cats don','cheese cut soup don','cheese katsu'] },
    { kr:'온센타마동', en:'ONSEN TAMA DON', accept:['onsen tama don','onsen tamadon','on sen tama don','onsen tomorrow don','on send tama don','onsen tama','on santa madon','onset tama don'] },
    { kr:'가라아게동', en:'KARAAGE DON', accept:['karaage don','kara age don','karage don','car adge don','karaoke don','cara don','kara don','car ah gay don','karate don'] },
    { kr:'하치로 스페셜', en:'HACHIRO SPECIAL', accept:['hachiro special','hachi ro special','hachiro','hach hero special','hatch hero special','hachiro','how chiro special'] },
    { kr:'시바이누 파르페', en:'SHIBA INU PARFAIT', accept:['shiba inu parfait','shiba inu parfe','sheba inu parfait','shiba inu par fait','shiba inu perfect','shiba parfait','shiba inu'] },
  ];

  // ---------- 상태 ----------
  const S={playing:false,idx:0,passed:0,t:0,speed:1,bowlX:0,gateOpen:0,mood:'normal',moodT:0,tries:0,heardLast:''};
  let dt=0,last=0;
  let shakeT=0, flashT=0, flashColor='rgba(200,80,60,';
  const confetti=[];

  function currentMenu(){ return MENUS[S.idx%MENUS.length]; }
  function newBowl(){
    S.bowlX=-60*scale; S.gateOpen=0; S.tries=0; S.heardLast='';
    const m=currentMenu();
    targetKr.textContent=m.kr;
    targetEn.textContent='"'+m.en+'"';
    heardEl.textContent='';
  }
  function reset(){
    S.idx=0; S.passed=0; S.t=0; S.speed=1; S.mood='normal';
    newBowl();
  }

  // ---------- 사운드 (WebAudio 합성 — 파일 없이 동작) ----------
  let AC=null;
  function audioCtx(){
    if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); }
    if(AC&&AC.state==='suspended') AC.resume();
    return AC;
  }
  function tone(freq,delay,dur,opt){
    const ac=audioCtx(); if(!ac) return;
    const o=opt||{};
    const t0=ac.currentTime+delay;
    const osc=ac.createOscillator(), g=ac.createGain();
    osc.type=o.type||'square';
    osc.frequency.setValueAtTime(freq,t0);
    if(o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo,t0+dur);
    const vol=o.vol||0.12;
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t0); osc.stop(t0+dur+0.1);
  }
  function bark(delay,pitch){ // 시바견 "왕!"
    tone(480*pitch,delay,0.1,{type:'sawtooth',vol:0.22,slideTo:150*pitch});
    tone(240*pitch,delay+0.012,0.1,{type:'square',vol:0.12,slideTo:90*pitch});
  }
  function sfxPass(){
    tone(880,0,0.12,{vol:0.14}); tone(1318,0.13,0.22,{vol:0.14});
    bark(0.34,1.3); // 신난 왕!
  }
  function sfxFail(){
    tone(200,0,0.28,{type:'sawtooth',vol:0.16,slideTo:100}); // 킹받는 부저
    bark(0.12,0.8); bark(0.3,0.72); // 왕! 왕! (저음 2연타)
    tone(659,0.5,0.14,{type:'triangle',vol:0.1,slideTo:415}); // "응~ 아니야~" 하강음
  }
  function sfxGameOver(){
    [392,370,349,311].forEach((f,i)=>tone(f,i*0.27,0.26,{type:'sawtooth',vol:0.12,slideTo:f*0.96}));
    bark(1.25,0.65);
  }

  // ---------- 카메라 (전체 화면 배경) ----------
  let camVideo=null, camOn=false, camTried=false;
  const FILTERS=['하치마키 必勝','스시 대장','시바 변신'];
  let filterIdx=0;
  async function ensureCam(){
    if(camOn||camTried) return;
    camTried=true;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return;
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
      camVideo=document.createElement('video');
      camVideo.srcObject=stream; camVideo.muted=true;
      camVideo.setAttribute('playsinline','');
      camVideo.playsInline=true;
      await camVideo.play();
      camOn=true;
      initFaceDetection();
    }catch(e){ camOn=false; }
  }

  // ---------- 얼굴 인식 (MediaPipe) — 필터가 진짜 얼굴을 따라다님 ----------
  let fd=null, fdBusy=false, faceRaw=null, face=null, faceLostT=0;
  function initFaceDetection(){
    if(fd||typeof FaceDetection==='undefined') return;
    try{
      fd=new FaceDetection({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/'+f});
      fd.setOptions({model:'short',minDetectionConfidence:0.5});
      fd.onResults(res=>{
        fdBusy=false;
        if(res.detections&&res.detections.length){
          const d=res.detections[0];
          faceRaw={bb:d.boundingBox,lm:d.landmarks};
          faceLostT=0;
        }
      });
      detectLoop();
    }catch(e){ fd=null; }
  }
  function detectLoop(){
    if(camOn&&fd&&camVideo&&camVideo.readyState>=2&&!fdBusy){
      fdBusy=true;
      fd.send({image:camVideo}).catch(()=>{ fdBusy=false; });
    }
    setTimeout(detectLoop,80);
  }
  function videoTransform(){
    const vw=camVideo.videoWidth||640, vh=camVideo.videoHeight||480;
    const s=Math.max(W/vw,H/vh);
    return {dw:vw*s,dh:vh*s,ox:(W-vw*s)/2,oy:(H-vh*s)/2};
  }
  function toCanvas(pt,T){ return {x: W-(T.ox+pt.x*T.dw), y: T.oy+pt.y*T.dh}; } // 거울 반전
  function updateFace(){
    faceLostT+=dt;
    if(faceRaw){
      const T=videoTransform();
      const bb=faceRaw.bb;
      const lm=faceRaw.lm.map(p=>toCanvas(p,T));
      // 눈 두 개를 화면 x 기준으로 정렬해서 기울기 계산 (거울 반전 대응)
      const eA=lm[0].x<lm[1].x?lm[0]:lm[1], eB=lm[0].x<lm[1].x?lm[1]:lm[0];
      const t={
        x: W-(T.ox+bb.xCenter*T.dw),
        y: T.oy+bb.yCenter*T.dh,
        w: bb.width*T.dw,
        angle: Math.atan2(eB.y-eA.y,eB.x-eA.x),
        eyes:{x:(eA.x+eB.x)/2,y:(eA.y+eB.y)/2},
        nose:lm[2], mouth:lm[3]
      };
      if(!face){ face=t; }
      else {
        const k=0.4;
        face.x+=(t.x-face.x)*k; face.y+=(t.y-face.y)*k; face.w+=(t.w-face.w)*k;
        face.angle+=(t.angle-face.angle)*k;
        ['eyes','nose','mouth'].forEach(p=>{ face[p].x+=(t[p].x-face[p].x)*k; face[p].y+=(t[p].y-face[p].y)*k; });
      }
      faceRaw=null;
    }
    if(faceLostT>1.2) face=null; // 한동안 못 찾으면 필터 숨김
  }

  // ---------- 필터 그리기 (얼굴 좌표 기반) ----------
  function drawFaceFilter(){
    let f=face;
    if(!f){
      if(fd){ // 인식 로딩/얼굴 벗어남
        ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font=`900 ${Math.round(13*scale)}px sans-serif`;
        ctx.textAlign='center'; ctx.fillText('😶 얼굴을 화면에 비춰주세요',W/2,H*0.3); ctx.textAlign='left';
        return;
      }
      // 얼굴 인식 라이브러리가 없을 때 고정 위치 대체
      f={x:W/2,y:H*0.32,w:Math.min(W,H)*0.45,angle:0,
         eyes:{x:W/2,y:H*0.28},nose:{x:W/2,y:H*0.34},mouth:{x:W/2,y:H*0.4}};
    }
    if (filterIdx===0) filterHachimaki(f);
    else if (filterIdx===1) filterSushi(f);
    else filterShiba(f);
  }
  function filterHachimaki(f){ // 이마에 딱 붙는 必勝 머리띠
    ctx.save();
    ctx.translate(f.eyes.x,f.eyes.y-f.w*0.38); ctx.rotate(f.angle);
    const bw=f.w*1.4, bh=Math.max(14,f.w*0.24);
    ctx.fillStyle='#fff'; rr(-bw/2,-bh/2,bw,bh,bh*0.3); ctx.fill();
    ctx.strokeStyle='#cfc8b4'; ctx.lineWidth=2; rr(-bw/2,-bh/2,bw,bh,bh*0.3); ctx.stroke();
    ctx.fillStyle='#c8503c';
    ctx.beginPath(); ctx.arc(0,0,bh*0.36,0,7); ctx.fill();
    ctx.font=`900 ${Math.round(bh*0.66)}px sans-serif`; ctx.textAlign='center';
    ctx.fillText('必',-bw*0.28,bh*0.24);
    ctx.fillText('勝',bw*0.28,bh*0.24);
    // 옆 매듭 + 늘어진 끈
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(bw/2-2,0); ctx.lineTo(bw/2+bh*0.9,-bh*0.7); ctx.lineTo(bw/2+bh*0.6,bh*0.15); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bw/2-2,0); ctx.lineTo(bw/2+bh*1.1,bh*0.9); ctx.lineTo(bw/2+bh*0.4,bh*0.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function filterSushi(f){ // 두건 + 코밑에서 축 처지는 콧수염
    ctx.save();
    ctx.translate(f.eyes.x,f.eyes.y-f.w*0.34); ctx.rotate(f.angle);
    ctx.fillStyle='#2b4a8b';
    ctx.beginPath();
    ctx.moveTo(-f.w*0.74,0);
    ctx.quadraticCurveTo(0,-f.w*1.0,f.w*0.74,0);
    ctx.closePath(); ctx.fill();
    rr(-f.w*0.74,-f.w*0.09,f.w*1.48,f.w*0.18,f.w*0.05); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`900 ${Math.round(f.w*0.34)}px sans-serif`;
    ctx.textAlign='center'; ctx.fillText('寿',0,-f.w*0.3);
    ctx.restore();
    // 콧수염: 코 바로 아래 → 입꼬리 옆으로 제대로 축 늘어짐
    const mx=(f.nose.x*0.6+f.mouth.x*0.4), my=(f.nose.y*0.55+f.mouth.y*0.45);
    ctx.save();
    ctx.translate(mx,my); ctx.rotate(f.angle);
    ctx.strokeStyle='#26211c'; ctx.lineCap='round';
    ctx.lineWidth=Math.max(3,f.w*0.06);
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(s*f.w*0.02,0);
      ctx.bezierCurveTo(s*f.w*0.2,-f.w*0.05, s*f.w*0.3,f.w*0.05, s*f.w*0.33,f.w*0.26);
      ctx.stroke();
      // 끝부분 얇게 한 번 더 늘어뜨림
      ctx.lineWidth=Math.max(2,f.w*0.035);
      ctx.beginPath();
      ctx.moveTo(s*f.w*0.33,f.w*0.26);
      ctx.quadraticCurveTo(s*f.w*0.34,f.w*0.36, s*f.w*0.28,f.w*0.42);
      ctx.stroke();
      ctx.lineWidth=Math.max(3,f.w*0.06);
    }
    ctx.fillStyle='#26211c';
    ctx.beginPath(); ctx.ellipse(0,-f.w*0.01,f.w*0.1,f.w*0.04,0,0,7); ctx.fill();
    ctx.restore();
  }
  function filterShiba(f){ // 귀 + 코 + 수염 + 볼터치
    ctx.save();
    ctx.translate(f.eyes.x,f.eyes.y); ctx.rotate(f.angle);
    for(const s of [-1,1]){
      ctx.fillStyle='#f0a83c';
      ctx.beginPath();
      ctx.moveTo(s*f.w*0.28,-f.w*0.5);
      ctx.lineTo(s*f.w*0.62,-f.w*1.05);
      ctx.lineTo(s*f.w*0.72,-f.w*0.42);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fdf4e3';
      ctx.beginPath();
      ctx.moveTo(s*f.w*0.38,-f.w*0.55);
      ctx.lineTo(s*f.w*0.58,-f.w*0.9);
      ctx.lineTo(s*f.w*0.63,-f.w*0.5);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // 코
    ctx.save();
    ctx.translate(f.nose.x,f.nose.y); ctx.rotate(f.angle);
    ctx.fillStyle='#26211c';
    ctx.beginPath(); ctx.ellipse(0,0,f.w*0.13,f.w*0.09,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(-f.w*0.04,-f.w*0.025,f.w*0.035,f.w*0.02,0,0,7); ctx.fill();
    // 수염
    ctx.strokeStyle='rgba(38,33,28,.9)'; ctx.lineWidth=Math.max(2,f.w*0.018); ctx.lineCap='round';
    for(const s of [-1,1]) for(let i=-1;i<=1;i++){
      ctx.beginPath();
      ctx.moveTo(s*f.w*0.2,f.w*0.02+i*f.w*0.06);
      ctx.quadraticCurveTo(s*f.w*0.45,i*f.w*0.09, s*f.w*0.6,f.w*0.03+i*f.w*0.13);
      ctx.stroke();
    }
    // 볼터치
    ctx.fillStyle='rgba(240,140,110,.45)';
    for(const s of [-1,1]){ ctx.beginPath(); ctx.ellipse(s*f.w*0.42,f.w*0.1,f.w*0.13,f.w*0.08,0,0,7); ctx.fill(); }
    ctx.restore();
  }

  function drawCamBG(){
    if(!(camOn&&camVideo&&camVideo.readyState>=2)) return false;
    const T=videoTransform();
    ctx.save();
    ctx.translate(W,0); ctx.scale(-1,1); // 거울 모드
    ctx.drawImage(camVideo,T.ox,T.oy,T.dw,T.dh);
    ctx.restore();
    updateFace();
    drawFaceFilter();
    return true;
  }

  let stamp=null, stampT=0;
  function showStamp(text,color){ stamp={text,color}; stampT=1.4; }
  function drawStamp(){
    if(stampT<=0||!stamp) return;
    const sx=face?face.x:W/2, sy=face?face.y:H*0.38;
    const sz=face?Math.max(22*scale,face.w*0.28):26*scale;
    const pop=stampT>1.2?(1.4-stampT)*5+0.3:1; // 쾅 찍히는 팝
    ctx.save();
    ctx.translate(sx,sy); ctx.rotate(-0.22); ctx.scale(pop,pop);
    ctx.globalAlpha=Math.min(1,stampT*1.8);
    ctx.font=`900 ${Math.round(sz)}px sans-serif`;
    const tw=ctx.measureText(stamp.text).width;
    ctx.strokeStyle=stamp.color; ctx.lineWidth=4;
    ctx.strokeRect(-tw/2-10,-sz*0.85,tw+20,sz*1.7);
    ctx.fillStyle=stamp.color; ctx.textAlign='center';
    ctx.fillText(stamp.text,0,sz*0.34);
    ctx.restore();
  }
  // 화면(벨트 위쪽) 탭 → 필터 변경
  cv.addEventListener('pointerdown',e=>{
    const rect=cv.getBoundingClientRect();
    const y=e.clientY-rect.top;
    if(camOn&&y<H*0.6){
      filterIdx=(filterIdx+1)%FILTERS.length;
      bark(0,1.15);
    }
  });

  // ---------- 폭죽 ----------
  const CONF_COLORS=['#f0a83c','#c8503c','#3a9b5c','#5b7fa6','#fff'];
  function spawnConfetti(x,y){
    for(let i=0;i<26;i++){
      confetti.push({
        x,y,
        vx:(Math.random()-0.5)*260*scale,
        vy:(-Math.random()*220-60)*scale,
        s:(Math.random()*5+3)*scale,
        c:CONF_COLORS[i%CONF_COLORS.length],
        rot:Math.random()*6, vr:(Math.random()-0.5)*10,
        life:1.2+Math.random()*0.5
      });
    }
  }
  function updateConfetti(){
    for(let i=confetti.length-1;i>=0;i--){
      const p=confetti[i];
      p.life-=dt; if(p.life<=0){ confetti.splice(i,1); continue; }
      p.vy+=560*scale*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=Math.min(1,p.life);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
      ctx.restore();
    }
  }

  // ---------- 판정 (관대하게) ----------
  const WORD_FIX={dong:'don',done:'don',dawn:'don',dun:'don',ton:'don',tone:'don',tong:'don',down:'don'};
  function normalize(s){
    return s.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim()
      .split(' ').map(w=>WORD_FIX[w]||w).join(' ');
  }
  function lev(a,b){
    const m=a.length,n=b.length;
    const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
    for(let j=0;j<=n;j++) d[0][j]=j;
    for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return d[m][n];
  }
  function isMatch(heard){
    const h=normalize(heard);
    if(!h) return false;
    const hs=h.replace(/ /g,'');
    return currentMenu().accept.some(a=>{
      const na=normalize(a);
      if (h.includes(na)) return true;
      const nas=na.replace(/ /g,'');
      if (hs.includes(nas)) return true; // 띄어쓰기 무시하고 포함
      const dist=Math.min(lev(h,na),lev(hs,nas));
      return dist <= Math.max(2,Math.floor(na.length*0.34));
    });
  }
  const SASS=[ // 킹받는 하치 멘트
    '네? 뭐라구요? 🙉',
    '음~ 아닌데요 (도리도리)',
    '그 발음으로는 못 지나갑니다 손님 😤',
    '하치가 못 알아들었어요. 다시!',
    'L발음이... 아니 그냥 다시 하세요',
    '혀에 힘 빼시고~ 다시 한 번?',
  ];
  function judge(heard){
    if(!S.playing) return;
    S.heardLast=heard;
    if (isMatch(heard)){
      heardEl.textContent='🟢 "'+heard+'" — 통과!';
      S.gateOpen=1; S.mood='happy'; S.moodT=1.2;
      sfxPass();
      showStamp('合格','#3a9b5c');
      flashColor='rgba(58,155,92,'; flashT=0.22;
      spawnConfetti(W*0.74,H*0.4);
    } else {
      S.tries++;
      heardEl.textContent='🔴 "'+heard+'" ...라고 들렸어요';
      S.mood='sass'; S.moodT=1.2;
      sfxFail();
      showStamp('不合格','#c8503c');
      flashColor='rgba(200,80,60,'; flashT=0.32;
      shakeT=0.45;
      S.bowlX=Math.max(-40*scale,S.bowlX-30*scale); // 틀리면 살짝 뒤로 → 재도전 기회
      showSass();
    }
  }
  let sassText='',sassT=0;
  function showSass(){ sassText=SASS[Math.floor(Math.random()*SASS.length)]; sassT=1.6; }

  // ---------- 음성 인식 ----------
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null, listening=false;
  if (SR){
    rec=new SR();
    rec.lang='en-US';
    rec.interimResults=false;
    rec.maxAlternatives=6;
    rec.onresult=e=>{
      const alts=[...e.results[0]].map(r=>r.transcript);
      // 여러 후보 중 하나라도 매치면 통과
      const hit=alts.find(t=>isMatch(t));
      judge(hit||alts[0]);
    };
    rec.onend=()=>{ listening=false; micBtn.classList.remove('listening'); micBtn.textContent='🎤 누르고 발음하기'; };
    rec.onerror=ev=>{
      listening=false; micBtn.classList.remove('listening');
      if (ev.error==='not-allowed'||ev.error==='service-not-allowed'){
        enableTypeMode('마이크 권한이 막혀 있어요. 타이핑 모드로 전환합니다.');
      } else heardEl.textContent='(잘 안 들렸어요, 다시!)';
      micBtn.textContent='🎤 누르고 발음하기';
    };
  }
  function enableTypeMode(msg){
    micBtn.classList.add('hidden');
    typeRow.style.display='flex';
    if(msg) heardEl.textContent=msg;
  }
  if (!SR) micWarn.textContent='⚠️ 이 환경은 음성 인식이 지원되지 않아 타이핑 모드로 실행됩니다. (호스팅된 링크를 크롬/사파리로 열면 음성 모드 사용 가능)';

  // 마이크 권한을 명시적으로 먼저 요청해야 iOS 사파리/일부 브라우저에서 프롬프트가 뜬다
  let micReady=false;
  async function ensureMic(){
    if (micReady) return true;
    if (!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      enableTypeMode('이 브라우저는 마이크를 지원하지 않아 타이핑 모드로 전환합니다.');
      return false;
    }
    try {
      heardEl.textContent='마이크 권한을 요청하는 중...';
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(t=>t.stop());
      micReady=true;
      heardEl.textContent='';
      return true;
    } catch(e){
      if (window.self!==window.top){
        enableTypeMode('내장 프레임에서는 마이크가 차단됩니다. 이 페이지를 새 탭/외부 브라우저로 열어주세요. 우선 타이핑 모드로!');
      } else {
        enableTypeMode('마이크 권한이 차단되어 있어요. 주소창의 자물쇠 아이콘 → 마이크 허용 후 새로고침! 우선 타이핑 모드로 전환합니다.');
      }
      return false;
    }
  }
  micBtn.addEventListener('click',async ()=>{
    if(!S.playing||!rec||listening) return;
    if(!(await ensureMic())) return;
    try {
      rec.start(); listening=true;
      micBtn.classList.add('listening');
      micBtn.textContent='🎙️ 듣는 중... 말하세요!';
    } catch(e){}
  });
  typeGo.addEventListener('click',()=>{ if(S.playing&&typeInput.value){ judge(typeInput.value); typeInput.value=''; } });
  typeInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ typeGo.click(); } });

  // ---------- 그리기 ----------
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
  function drawBG(camDrawn){
    if(!camDrawn){ ctx.fillStyle='#f5efe0'; ctx.fillRect(-20,-20,W+40,H+40); }
    ctx.fillStyle='rgba(30,42,56,.92)'; ctx.fillRect(-20,-20,W+40,H*0.1+20);
    ctx.fillStyle='#f5efe0'; ctx.font=`900 ${Math.round(13*scale)}px sans-serif`;
    ctx.fillText('HACHIRO 발음 검문소 丼 · 통과 '+S.passed+'개', 12, H*0.065);
    if(camOn){
      ctx.textAlign='right';
      ctx.fillStyle='#f0a83c';
      ctx.fillText(FILTERS[filterIdx]+' (톡!)',W-12,H*0.065);
      ctx.textAlign='left';
    }
  }
  function drawBelt(){
    const by=H*0.62;
    ctx.fillStyle='#3f4d5c'; ctx.fillRect(0,by,W,26*scale);
    ctx.fillStyle='#5b6b7c';
    const gap=44*scale, off=((S.t*60*S.speed)%gap);
    for(let x=-gap+off;x<W;x+=gap){ rr(x,by+6*scale,26*scale,14*scale,4*scale); ctx.fill(); }
    // 게이트
    const gx=W*0.74;
    ctx.fillStyle='#1e2a38';
    ctx.fillRect(gx-6*scale,H*0.16,12*scale,by-H*0.16); // 기둥
    const doorH=(by-H*0.3)*(1-S.gateOpen);
    ctx.fillStyle='#c8503c';
    ctx.fillRect(gx-30*scale,by-doorH,60*scale,doorH);
    ctx.fillStyle='#f5efe0'; ctx.font=`900 ${Math.round(11*scale)}px sans-serif`;
    ctx.textAlign='center';
    if (S.gateOpen<1) ctx.fillText('STOP',gx,by-doorH/2+4*scale);
    ctx.textAlign='left';
  }
  function drawBowl(){
    const by=H*0.62;
    const cx=S.bowlX, baseY=by;
    ctx.fillStyle='#e8e2d2';
    ctx.beginPath();
    ctx.moveTo(cx-24*scale,baseY); ctx.lineTo(cx+24*scale,baseY);
    ctx.lineTo(cx+17*scale,baseY-20*scale); ctx.lineTo(cx-17*scale,baseY-20*scale);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#c8503c'; ctx.fillRect(cx-20*scale,baseY-10*scale,40*scale,4*scale);
    ctx.fillStyle='#b8763a';
    ctx.beginPath(); ctx.ellipse(cx,baseY-22*scale,17*scale,7*scale,0,0,7); ctx.fill();
    // 이름표
    ctx.fillStyle='#fff'; rr(cx-40*scale,baseY-56*scale,80*scale,22*scale,6*scale); ctx.fill();
    ctx.strokeStyle='#1e2a38'; ctx.lineWidth=1.5; rr(cx-40*scale,baseY-56*scale,80*scale,22*scale,6*scale); ctx.stroke();
    ctx.fillStyle='#1e2a38'; ctx.font=`900 ${Math.round(11*scale)}px sans-serif`;
    ctx.textAlign='center'; ctx.fillText(currentMenu().kr,cx,baseY-41*scale); ctx.textAlign='left';
  }
  function drawHachi(){
    // 게이트 옆 심사위원 하치
    const cx=W*0.87, r=34*scale;
    let cy=H*0.5;
    if (S.mood==='happy'&&S.moodT>0) cy-=Math.abs(Math.sin(S.t*12))*10*scale; // 신나서 점프
    ctx.save();
    if (S.mood==='sass' && S.moodT>0) ctx.translate(Math.sin(S.t*40)*3*scale,0); // 도리도리
    ctx.fillStyle='#f0a83c';
    ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
    // 귀
    ctx.beginPath(); ctx.moveTo(cx-r*0.8,cy-r*0.4); ctx.lineTo(cx-r*0.6,cy-r*1.3); ctx.lineTo(cx-r*0.15,cy-r*0.75); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+r*0.15,cy-r*0.75); ctx.lineTo(cx+r*0.6,cy-r*1.3); ctx.lineTo(cx+r*0.8,cy-r*0.4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fdf4e3';
    ctx.beginPath(); ctx.ellipse(cx,cy+r*0.35,r*0.55,r*0.42,0,0,7); ctx.fill();
    ctx.fillStyle='#1e2a38';
    if (S.mood==='happy'&&S.moodT>0){
      ctx.lineWidth=3*scale; ctx.strokeStyle='#1e2a38';
      ctx.beginPath(); ctx.arc(cx-r*0.3,cy-r*0.15,r*0.14,Math.PI,0); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx+r*0.3,cy-r*0.15,r*0.14,Math.PI,0); ctx.stroke();
    } else if (S.mood==='sass'&&S.moodT>0){
      ctx.fillRect(cx-r*0.42,cy-r*0.2,r*0.26,r*0.08); // 째려봄
      ctx.fillRect(cx+r*0.16,cy-r*0.2,r*0.26,r*0.08);
    } else {
      ctx.beginPath(); ctx.arc(cx-r*0.3,cy-r*0.15,r*0.11,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+r*0.3,cy-r*0.15,r*0.11,0,7); ctx.fill();
    }
    ctx.fillStyle='#1e2a38';
    ctx.beginPath(); ctx.arc(cx,cy+r*0.2,r*0.1,0,7); ctx.fill();
    // 심사위원 리본
    ctx.fillStyle='#c8503c'; rr(cx-r*0.5,cy+r*0.75,r,r*0.35,4*scale); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`900 ${Math.round(9*scale)}px sans-serif`;
    ctx.textAlign='center'; ctx.fillText('심사위원',cx,cy+r*1.0); ctx.textAlign='left';
    ctx.restore();
    // 멘트 말풍선
    if (sassT>0){
      ctx.fillStyle='#fff';
      rr(cx-160*scale,cy-r*2.4,180*scale,34*scale,10*scale); ctx.fill();
      ctx.strokeStyle='#1e2a38'; ctx.lineWidth=2; rr(cx-160*scale,cy-r*2.4,180*scale,34*scale,10*scale); ctx.stroke();
      ctx.fillStyle='#c8503c'; ctx.font=`900 ${Math.round(12*scale)}px sans-serif`;
      ctx.textAlign='center'; ctx.fillText(sassText,cx-70*scale,cy-r*2.4+22*scale); ctx.textAlign='left';
    }
    if (S.mood==='happy'&&S.moodT>0){
      ctx.font=`${Math.round(22*scale)}px sans-serif`;
      ctx.fillText('✨ PASS!',cx-60*scale,cy-r*1.6);
    }
  }

  // ---------- 루프 ----------
  function loop(ts){
    requestAnimationFrame(loop);
    dt=Math.min((ts-last)/1000,0.033); last=ts;
    if(!W) resize();
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if (shakeT>0){ // 틀렸을 때 화면 흔들림
      ctx.translate((Math.random()-0.5)*10*scale*shakeT*2,(Math.random()-0.5)*10*scale*shakeT*2);
    }
    const camDrawn=drawCamBG();
    drawBG(camDrawn); drawBelt(); drawBowl(); drawHachi();
    updateConfetti();
    drawStamp();
    ctx.restore();
    if (flashT>0){ // 판정 플래시
      ctx.fillStyle=flashColor+(flashT*1.4)+')';
      ctx.fillRect(0,0,W,H);
    }
    if (S.moodT>0) S.moodT-=dt;
    if (sassT>0) sassT-=dt;
    if (shakeT>0) shakeT-=dt;
    if (flashT>0) flashT-=dt;
    if (stampT>0) stampT-=dt;
    if (!S.playing) return;

    S.t+=dt;
    const gx=W*0.74;
    // 그릇 이동 (듣는 동안엔 거의 정지)
    let spd=(26+S.passed*5)*scale*S.speed;
    if (listening) spd*=0.15;
    if (S.gateOpen>=1){
      S.bowlX+=spd*4*dt; // 통과 가속
      if (S.bowlX>W+60*scale){
        S.passed++; S.idx++;
        newBowl();
      }
    } else {
      if (S.bowlX < gx-46*scale) S.bowlX+=spd*dt;
      else gameOver(); // 게이트 도착 = 실패
    }
  }
  requestAnimationFrame(loop);

  function gameOver(){
    S.playing=false;
    if(rec&&listening){ try{rec.stop();}catch(e){} }
    sfxGameOver();
    failEl.innerHTML = S.heardLast
      ? '마지막으로 하치가 들은 말:<br>"<b>'+S.heardLast+'</b>" ...였습니다 🫠'
      : '아무 말도 못 하고 게이트에 도착했다...';
    finalEl.textContent=S.passed+'개 통과';
    resultBox.classList.remove('hidden');
    overlay.querySelector('h1').textContent='검문 탈락...! 😤';
    overlay.querySelector('.sub').innerHTML='하치: "발음 연습 다시 하고 오세요"<br>친구에게 도전장을 내밀어 보세요!';
    btn.textContent='다시 도전';
    overlay.classList.remove('hidden');
  }

  function startGame(){
    reset();
    resize();
    overlay.classList.add('hidden');
    S.playing=true;
    audioCtx();     // 사용자 제스처로 오디오 활성화
    ensureCam();    // 카메라 켜기 (허용 시 전체 화면 + 얼굴 추적 필터)
    if (!SR) enableTypeMode();
  }
  btn.addEventListener('click',startGame);

  resize();
})();
</script>
</body>
</html>
