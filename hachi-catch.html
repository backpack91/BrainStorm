const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = CFG.logicalW, H = 700, SCALE = 1;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  SCALE = vw / CFG.logicalW;
  W = CFG.logicalW;
  H = vh / SCALE;
  canvas.width = vw * dpr;
  canvas.height = vh * dpr;
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  ctx.setTransform(dpr * SCALE, 0, 0, dpr * SCALE, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
 * 사운드 (WebAudio, 외부 파일 없음)
 * ============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* 무음 진행 */ }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, delay) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'triangle';
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol || 0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
const SFX = {

  wrong()   { beep(170, 0.25, 'sawtooth', 0.14); beep(120, 0.3, 'sawtooth', 0.12, 0.08); },

let angryCustomers = [];      // 화나서 나간 손님들 (리뷰 생성용)
let reviews = [];             // 게임오버 리뷰
let customer = null;          // 현재 손님 페르소나
let bubble = null;            // 손님 말풍선 {text, t, dur}
let talkTimer = 0;            // 다음 혼잣말까지 남은 시간
let hurrySaid = false;        // 재촉 대사는 손님당 1번
let happyT = 0;               // 하치 기쁨 표정 타이머

const hachi = { x: W / 2, targetX: W / 2, w: 96, walk: 0 };

function currentMenu()  { return MENUS[menuIdx]; }
function neededIngId()  { return curRecipe[stepIdx]; }
function isFever()      { return combo >= CFG.feverCombo; }
function evtOn(type)    { return evt && evt.type === type && evt.phase === 'on'; }
function fallSpeed() {
  return Math.min(CFG.maxFallSpeed,
    CFG.baseFallSpeed + menusDone * CFG.speedPerMenu + round * CFG.speedPerRound + playTime * CFG.timeSpeedRamp);
}
function spawnInterval() {
  return Math.max(CFG.minSpawnMs, CFG.baseSpawnMs - menusDone * 40 - round * 60);
}
function comboMult() { return Math.min(CFG.maxMult, 1 + Math.floor(combo / CFG.comboStep)); }
function patienceFor(menu) {
  const per = Math.max(CFG.patienceMinPerIng, CFG.patiencePerIng - menusDone * 0.22 - round * 0.6);
  return menu.recipe.length * per;
}
function setPatience() { patienceMax = patience = patienceFor(currentMenu()); }

function say(text, dur) { bubble = { text, t: 0, dur: dur || 2.6 }; }

function newCustomer() {
  const pool = CUSTOMERS.filter(c => !customer || c.name !== customer.name);
  customer = pick(pool);
  hurrySaid = false;
  talkTimer = 5 + Math.random() * 4;
  say(customer.order, 3);
}

function resetGame() {
  score = 0; lives = CFG.maxLives;
  menusDone = 0; round = 0; menuIdx = 0; stepIdx = 0;
  playTime = 0; spawnTimer = 0; hitTimer = 0; shakeT = 0;
  items = []; particles = []; toasts = []; bowlStack = [];
  serveAnim = null;
  combo = 0; maxCombo = 0; comboPop = 0;
  curRecipe = MENUS[0].recipe.slice();
  evt = null; lastEventType = null;
  nextEventIn = 7 + Math.random() * 5;
  fedTraps = []; angryCount = 0; angryCustomers = []; reviews = [];
  bubble = null; happyT = 0;
  hachi.x = hachi.targetX = W / 2;
  newCustomer();
  setPatience();
}

/* ============================================================
 * 스폰 로직
 * ============================================================ */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function spawnItem() {
  const need = neededIngId();
  const needOnScreen = items.some(it => it.kind === 'ing' && it.id === need);
  let item;
  if ((!needOnScreen && Math.random() < 0.8) || Math.random() < CFG.needChance) {
    item = { kind: 'ing', id: need, golden: Math.random() < CFG.goldenChance };
  } else if (Math.random() < CFG.trapChance) {
    const trap = pick(TRAPS);
    item = { kind: 'trap', trap };
  } else {
    // 오답용 재료: 전체 재료 중 현재 필요 재료가 아닌 것
    const pool = Object.keys(ING).filter(id => id !== need);
    item = { kind: 'ing', id: pick(pool) };
  }
  const r = CFG.itemRadius;
  item.x = r + 8 + Math.random() * (W - (r + 8) * 2);
  item.y = -r - 10;
  item.rot = (Math.random() - 0.5) * 0.5;
  item.rotSpd = (Math.random() - 0.5) * 2;
  item.spd = fallSpeed() * (0.9 + Math.random() * 0.25);
  if (item.golden) item.spd *= 1.35;  // 황금 재료는 빠르게 떨어진다
  items.push(item);
}

/* ============================================================
 * 이펙트
 * ============================================================ */
function addToast(text, opts) {
  toasts.push(Object.assign({ text, t: 0, dur: 1.6, big: false, x: W / 2, y: H * 0.42, color: COLOR.navy }, opts));
}
function addParticles(x, y, color, n) {
  for (let i = 0; i < (n || 10); i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 130;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, dur: 0.5 + Math.random() * 0.3, color, r: 2 + Math.random() * 3 });
  }
}

/* ============================================================
 * 판정
 * ============================================================ */
function bowlRect() {
  // 하치 머리 위 그릇의 캐치 영역
  const bw = 92, bh = 46;
  return { x: hachi.x - bw / 2, y: hachiBaseY() - 196, w: bw, h: bh };
}
function hachiBaseY() { return H - 68; }

function onCatch(item) {
  const br = bowlRect();
  // 피버 중에는 순서 무시 — 함정만 아니면 뭐든 정답
  if (item.kind === 'ing' && (item.id === neededIngId() || isFever())) {
    // 정답!
    const wasFever = isFever();
    combo += item.golden ? 2 : 1;
    maxCombo = Math.max(maxCombo, combo);
    comboPop = 0.35;
    let gain = CFG.scorePerCatch * (item.golden ? 3 : 1) * comboMult() + Math.floor(playTime);
    if (evtOn('rush')) gain *= 2;
    score += gain;
    bowlStack.push(ING[item.id].emoji);
    happyT = 0.45;
    if (!wasFever && isFever()) {
      addToast('🔥 하치 각성!! 지금부터 아무 재료나 OK!!', { big: true, dur: 2.2, color: COLOR.orangeDark });
      SFX.fever();
    }
    addParticles(item.x, br.y, item.golden ? '#f5c542' : COLOR.orange, item.golden ? 24 : 12);
    if (item.golden) {
      addToast(pick(GOLDEN_LINES) + ' +' + gain, { y: br.y - 48, dur: 1.2, color: '#b8860b' });
    } else {
      addToast(pick(CATCH_LINES) + ' +' + gain, { y: br.y - 30, dur: 0.7, color: COLOR.orangeDark });
    }
    if (combo >= 5 && combo % 5 === 0) {
      addToast('🔥 ' + combo + ' 콤보!!', { y: H * 0.3, dur: 1.1, color: COLOR.red });
    }
    SFX.catch(combo);
    stepIdx++;
    if (stepIdx >= curRecipe.length) menuComplete();
  } else {
    // 오답 or 함정
    if (hitTimer > 0) return;
    lives--; hitTimer = CFG.hitInvincibleMs / 1000; shakeT = 0.5;
    combo = 0;
    if (item.kind === 'trap') fedTraps.push(item.trap.name);
    const line = item.kind === 'trap' ? pick(item.trap.lines) : pick(WRONG_ORDER_LINES);
    addToast(line, { big: true, dur: 2.0, color: COLOR.red });
    addParticles(item.x, br.y, COLOR.red, 14);
    SFX.wrong();
    if (lives <= 0) gameOver();
  }
}

function menuComplete() {
  const menu = currentMenu();
  const bonus = Math.floor(CFG.scorePerMenu * (1 + round * 0.5));
  // 남은 손님 인내심 비례 서비스 보너스
  const serviceBonus = Math.floor(Math.max(0, patience / patienceMax) * CFG.timeBonusMax * (1 + round * 0.5));
  score += bonus + serviceBonus;
  menusDone++;
  clearInfo = {
    name: menu.name, final: !!menu.final, bonus, serviceBonus,
    face: customer.face, custName: customer.name,
    sub: menu.final ? FINAL_CLEAR_SUB : customer.happy,
  };
  serveAnim = { t: 0, x: hachi.x, y: hachiBaseY() - 196, stack: bowlStack.slice() };
  bowlStack = [];
  items = [];
  toasts = [];
  scene = 'clear';
  clearTimer = 0;
  SFX.clear();
  // 다음 메뉴 준비
  menuIdx++;
  if (menuIdx >= MENUS.length) { menuIdx = 0; round++; }
  stepIdx = 0;
  curRecipe = currentMenu().recipe.slice();
  evt = null; // 진행 중이던 해프닝은 종료
  newCustomer();
  setPatience();
}

function patienceOut() {
  lives--; shakeT = 0.6; combo = 0;
  angryCount++;
  angryCustomers.push(customer);
  addToast('🤬 ' + customer.name + ': ' + customer.angry, { big: true, dur: 2.2, color: COLOR.red });
  SFX.wrong();
  if (lives <= 0) gameOver();
  else { setPatience(); newCustomer(); } // 다음 손님 입장
}

/* ---------- 해프닝 이벤트 ---------- */
function startEvent(forced) {
  const pool = Object.keys(EVT_INFO).filter(t => t !== lastEventType);
  const type = forced || pick(pool);
  lastEventType = type;
  evt = { type, phase: 'warn', t: 0, dur: EVT_INFO[type].dur };
  SFX.warn();
}

function eventGoesActive() {
  evt.phase = 'on'; evt.t = 0;
  if (evt.type === 'karen') applyKaren();
  if (evt.type === 'blackout') addToast('⚡ 아무것도 안 보인다!!', { big: true, dur: 1.4, color: COLOR.navy });
}

function applyKaren() {
  // 남은 레시피 중 하나를 다른 재료로 바꿔버린다
  const i = stepIdx + Math.floor(Math.random() * (curRecipe.length - stepIdx));
  const old = curRecipe[i];
  const nu = pick(Object.keys(ING).filter(id => id !== old));
  curRecipe[i] = nu;
  patience = Math.min(patienceMax, patience + 2); // 바꿨으니 조금은 기다려준다
  addToast('😤 ' + customer.name + ': 아 잠깐만요, ' + ING[old].name + ' 빼고 ' + ING[nu].name + '(으)로요;;', { big: true, dur: 2.4, color: COLOR.red });
  say('원래 좀 바뀔 수도 있죠~', 2.2);
  SFX.karen();
}

function spawnFish() {
  const fish = TRAPS.find(t => t.name === '생선');
  const r = CFG.itemRadius;
  items.push({
    kind: 'trap', trap: fish,
    x: r + 8 + Math.random() * (W - (r + 8) * 2), y: -r - 10,
    rot: (Math.random() - 0.5) * 0.5, rotSpd: (Math.random() - 0.5) * 3,
    spd: fallSpeed() * (1 + Math.random() * 0.3),
  });
}

/* ---------- 게임오버 리뷰 생성 ---------- */
function buildReviews() {
  const out = [];
  // 먹인 함정 리뷰가 최우선 (중복 제거, 최대 2개)
  [...new Set(fedTraps)].slice(0, 2).forEach(name => {
    if (TRAP_REVIEWS[name]) out.push(TRAP_REVIEWS[name]);
  });
  // 화나서 나간 손님은 자기 캐릭터로 리뷰를 남긴다
  const angryUnique = [...new Map(angryCustomers.filter(Boolean).map(c => [c.name, c])).values()];
  angryUnique.slice(0, 2 - Math.min(out.length, 1)).forEach(c => {
    if (out.length < 2) out.push({ name: c.name, stars: c.review.stars, text: c.review.text });
  });
  if (angryCount > 0 && angryUnique.length === 0 && out.length < 2) out.push(ANGRY_REVIEW);
  if (menusDone === 0) {
    out.push(ZERO_REVIEW);
  } else if (maxCombo >= CFG.feverCombo) {
    out.push(FEVER_REVIEW);
  } else {
    const good = GOOD_REVIEWS.find(r => menusDone >= r.min);
    if (good) out.push(good);
  }
  return out.slice(0, 3);
}

function gameOver() {
  scene = 'over';
  overTimer = 0;
  if (score > bestScore) bestScore = score;
  gameOverLine = pick(GAMEOVER_LINES);
  reviews = buildReviews();
  SFX.gameover();
}
let gameOverLine = GAMEOVER_LINES[0];

/* ============================================================
 * 입력 (드래그 + 키보드)
 * ============================================================ */
let dragging = false, lastPX = 0;
const keys = {};

function toLogicalX(clientX) { return clientX / SCALE; }

canvas.addEventListener('pointerdown', e => {
  initAudio();
  const lx = toLogicalX(e.clientX), ly = e.clientY / SCALE;
  if (scene === 'title') { startGame(); return; }
  if (scene === 'over') {
    if (overTimer > 0.6) startGame();
    return;
  }
  if (scene === 'play' || scene === 'clear') {
    dragging = true; lastPX = lx;
    canvas.setPointerCapture(e.pointerId);
  }
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const lx = toLogicalX(e.clientX);
  hachi.targetX += (lx - lastPX) * 1.25;  // 원핸드 드래그 감도
  lastPX = lx;
});
canvas.addEventListener('pointerup',   () => dragging = false);
canvas.addEventListener('pointercancel', () => dragging = false);
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((scene === 'title' || scene === 'over') && (e.key === ' ' || e.key === 'Enter')) { initAudio(); startGame(); }
});
window.addEventListener('keyup', e => keys[e.key] = false);

function startGame() {
  resetGame();
  scene = 'play';
  SFX.start();
  addToast('주문 들어왔습니다~!', { dur: 1.4, color: COLOR.navy });
}

/* ============================================================
 * 업데이트
 * ============================================================ */
let overTimer = 0;

function update(dt) {
  // 하치 이동 (모든 씬 공통 스무딩)
  if (keys.ArrowLeft)  hachi.targetX -= 320 * dt;
  if (keys.ArrowRight) hachi.targetX += 320 * dt;
  hachi.targetX = Math.max(hachi.w / 2, Math.min(W - hachi.w / 2, hachi.targetX));
  const prevX = hachi.x;
  hachi.x += (hachi.targetX - hachi.x) * Math.min(1, dt * 14);
  hachi.walk += Math.abs(hachi.x - prevX) * 0.08;

  // 파티클/토스트는 항상
  particles.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt; });
  particles = particles.filter(p => p.t < p.dur);
  toasts.forEach(t => t.t += dt);
  toasts = toasts.filter(t => t.t < t.dur);
  if (shakeT > 0) shakeT -= dt;
  if (hitTimer > 0) hitTimer -= dt;
  if (comboPop > 0) comboPop -= dt;
  if (happyT > 0) happyT -= dt;

  if (scene === 'play') {
    playTime += dt;

    // 손님 인내심 (생선 소나기 중에는 손님도 구경하느라 정지)
    if (!(evt && evt.type === 'sushi')) {
      patience -= dt;
      if (patience <= 0) patienceOut();
    }

    // 손님 수다 (말풍선)
    if (bubble) {
      bubble.t += dt;
      if (bubble.t >= bubble.dur) bubble = null;
    }
    if (customer) {
      if (!hurrySaid && patience / patienceMax < 0.32) {
        hurrySaid = true;
        say(customer.hurry, 2.8); // 재촉은 다른 말을 끊고 나온다
      } else if (!bubble) {
        talkTimer -= dt;
        if (talkTimer <= 0) { say(pick(customer.wait), 2.6); talkTimer = 5.5 + Math.random() * 4; }
      }
    }

    // 해프닝 이벤트 스케줄러
    if (!evt) {
      nextEventIn -= dt;
      if (nextEventIn <= 0) {
        startEvent();
        nextEventIn = 9 + Math.random() * 7;
      }
    } else {
      evt.t += dt;
      if (evt.phase === 'warn' && evt.t >= 1.6) eventGoesActive();
      else if (evt.phase === 'on' && evt.t >= evt.dur) evt = null;
    }

    spawnTimer -= dt * 1000;
    if (spawnTimer <= 0) {
      if (evtOn('sushi')) {
        // 생선 소나기 — 피하는 것만이 살길
        spawnFish();
        if (Math.random() < 0.6) spawnFish();
        spawnTimer = 240 + Math.random() * 120;
      } else {
        spawnItem();
        // 진행될수록 동시 낙하 확률 상승 (함정 사이에 정답이 끼는 상황 유도)
        const extra = Math.min(0.55, 0.18 + menusDone * 0.05 + round * 0.12);
        if (evtOn('rush') || Math.random() < extra) spawnItem();
        spawnTimer = spawnInterval() * (evtOn('rush') ? 0.35 : 1) * (0.75 + Math.random() * 0.5);
      }
    }

    const br = bowlRect();
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.spd * dt;
      it.rot += it.rotSpd * dt;
      // 캐치 판정: 그릇 영역
      if (it.y + CFG.itemRadius * 0.4 > br.y && it.y < br.y + br.h &&
          it.x > br.x - 6 && it.x < br.x + br.w + 6) {
        items.splice(i, 1);
        onCatch(it);
        // 메뉴 완성/게임오버로 씬이 바뀌면 items가 비워지므로 즉시 중단
        if (scene !== 'play') break;
        continue;
      }
      // 바닥으로 사라짐 — 필요 재료를 놓치면 콤보가 끊긴다
      if (it.y > H + CFG.itemRadius) {
        if (it.kind === 'ing' && it.id === neededIngId()) {
          if (combo >= CFG.comboStep) {
            addToast(pick(COMBO_BREAK_LINES), { dur: 1.0, y: H * 0.6, color: COLOR.red });
          } else if (Math.random() < 0.5) {
            addToast(pick(MISS_LINES), { dur: 0.9, y: H * 0.6, color: COLOR.navy2 });
          }
          combo = 0;
        }
        items.splice(i, 1);
      }
    }
  } else if (scene === 'clear') {
    clearTimer += dt;
    if (serveAnim) serveAnim.t += dt;
    if (clearTimer > 1.9) { scene = 'play'; serveAnim = null; spawnTimer = 400; }
  } else if (scene === 'over') {
    overTimer += dt;
  } else if (scene === 'title') {
    playTime += dt; // 타이틀 애니메이션용
  }
}

/* ============================================================
 * 렌더링
 * ============================================================ */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground() {
  // 주방 벽
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f7f1e3');
  g.addColorStop(1, '#efe5cf');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 노렌 (상단 커튼)
  ctx.fillStyle = COLOR.navy;
  ctx.fillRect(0, 0, W, 24);
  for (let i = 0; i < 5; i++) {
    const nx = i * (W / 5);
    ctx.fillRect(nx + 4, 24, W / 5 - 8, 16);
  }
  ctx.fillStyle = COLOR.cream;
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('HACHIRO', W / 2, 13);
  ctx.textBaseline = 'alphabetic';

  // 벽 타일 라인
  ctx.strokeStyle = 'rgba(30,42,56,0.06)';
  ctx.lineWidth = 1;
  for (let y = 90; y < H - 100; y += 46) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // 조리대 (바닥)
  const cy = H - 46;
  ctx.fillStyle = '#d8c9a8';
  ctx.fillRect(0, cy, W, H - cy);
  ctx.fillStyle = '#c4b28c';
  ctx.fillRect(0, cy, W, 6);
}

function drawHachi() {
  const x = hachi.x, baseY = hachiBaseY();
  const bob = Math.sin(hachi.walk) * 2;
  const lean = (hachi.targetX - hachi.x) * 0.02;
  const blink = (Math.sin(playTime * 1.7) > 0.96);
  const hurt = hitTimer > 0 && Math.floor(hitTimer * 12) % 2 === 0;

  ctx.save();
  ctx.translate(x, baseY + bob);
  ctx.rotate(lean * 0.15);
  if (hurt) ctx.globalAlpha = 0.45;

  // 그림자
  ctx.fillStyle = 'rgba(30,42,56,0.15)';
  ctx.beginPath(); ctx.ellipse(0, 4, 44, 9, 0, 0, Math.PI * 2); ctx.fill();

  // 다리
  ctx.fillStyle = COLOR.orange;
  const step = Math.sin(hachi.walk * 2) * 4;
  rr(-24, -26 + step * 0.4, 16, 26 - step * 0.4, 7); ctx.fill();
  rr(8,  -26 - step * 0.4, 16, 26 + step * 0.4, 7); ctx.fill();

  // 몸통
  ctx.fillStyle = COLOR.orange;
  rr(-30, -78, 60, 58, 18); ctx.fill();
  // 배 (크림)
  ctx.fillStyle = COLOR.cream;
  rr(-18, -66, 36, 42, 14); ctx.fill();

  // 앞치마 (네이비)
  ctx.fillStyle = COLOR.navy;
  rr(-22, -58, 44, 34, 8); ctx.fill();
  ctx.fillStyle = COLOR.orange;
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('八', 0, -37);
  ctx.strokeStyle = COLOR.navy;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-22, -55); ctx.lineTo(-30, -62); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(22, -55); ctx.lineTo(30, -62); ctx.stroke();

  // 팔 (위로 뻗어 그릇 받침)
  ctx.strokeStyle = COLOR.orange;
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-26, -64); ctx.lineTo(-40, -136); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(26, -64); ctx.lineTo(40, -136); ctx.stroke();
  // 손 (크림)
  ctx.fillStyle = COLOR.cream;
  ctx.beginPath(); ctx.arc(-40, -138, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(40, -138, 7, 0, Math.PI * 2); ctx.fill();

  // 꼬리 (말린 꼬리)
  ctx.strokeStyle = COLOR.orange;
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.arc(34, -74, 10, Math.PI * 0.9, Math.PI * 2.1);
  ctx.stroke();

  // 머리
  ctx.fillStyle = COLOR.orange;
  ctx.beginPath(); ctx.ellipse(0, -104, 34, 30, 0, 0, Math.PI * 2); ctx.fill();
  // 귀
  ctx.beginPath(); ctx.moveTo(-30, -118); ctx.lineTo(-24, -142); ctx.lineTo(-8, -126); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(30, -118); ctx.lineTo(24, -142); ctx.lineTo(8, -126); ctx.closePath(); ctx.fill();
  ctx.fillStyle = COLOR.cream;
  ctx.beginPath(); ctx.moveTo(-25, -122); ctx.lineTo(-22, -134); ctx.lineTo(-13, -124); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(25, -122); ctx.lineTo(22, -134); ctx.lineTo(13, -124); ctx.closePath(); ctx.fill();

  // 주둥이 (크림)
  ctx.fillStyle = COLOR.cream;
  ctx.beginPath(); ctx.ellipse(0, -96, 18, 14, 0, 0, Math.PI * 2); ctx.fill();
  // 눈썹 자리 크림
  ctx.beginPath(); ctx.ellipse(-13, -112, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -112, 6, 4, 0, 0, Math.PI * 2); ctx.fill();

  // 눈
  ctx.fillStyle = COLOR.navy;
  if (hurt) {
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('>', -13, -102);
    ctx.fillText('<', 13, -102);
  } else if (happyT > 0) {
    // 기쁨: ∩∩ 눈웃음
    ctx.lineWidth = 2.5; ctx.strokeStyle = COLOR.navy;
    ctx.beginPath(); ctx.arc(-13, -104, 4.5, Math.PI, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(13, -104, 4.5, Math.PI, Math.PI * 2); ctx.stroke();
  } else if (blink) {
    ctx.lineWidth = 2; ctx.strokeStyle = COLOR.navy;
    ctx.beginPath(); ctx.moveTo(-17, -106); ctx.lineTo(-9, -106); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, -106); ctx.lineTo(17, -106); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-13, -106, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(13, -106, 3.4, 0, Math.PI * 2); ctx.fill();
  }
  // 코 + 입
  ctx.fillStyle = COLOR.navy;
  ctx.beginPath(); ctx.arc(0, -96, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = COLOR.navy; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(0, -93); ctx.quadraticCurveTo(-4, -88, -8, -91); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -93); ctx.quadraticCurveTo(4, -88, 8, -91); ctx.stroke();
  // 볼터치
  ctx.fillStyle = 'rgba(200,80,60,0.35)';
  ctx.beginPath(); ctx.ellipse(-22, -96, 5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(22, -96, 5, 3.5, 0, 0, Math.PI * 2); ctx.fill();

  // 머리띠 (하치마키)
  ctx.fillStyle = COLOR.red;
  rr(-30, -126, 60, 9, 4); ctx.fill();

  ctx.restore();

  // 그릇 (머리 위)
  drawBowl(x, baseY - 196 + bob, bowlStack);
}

function drawBowl(cx, topY, stack) {
  // 캐치 영역 상단이 topY
  const bw = 92, bh = 40;
  ctx.save();
  ctx.translate(cx, topY + bh);

  // 그릇 본체
  ctx.fillStyle = COLOR.white;
  ctx.beginPath();
  ctx.moveTo(-bw / 2, -14);
  ctx.quadraticCurveTo(-bw / 2 + 6, 16, -bw / 4, 20);
  ctx.lineTo(bw / 4, 20);
  ctx.quadraticCurveTo(bw / 2 - 6, 16, bw / 2, -14);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = COLOR.navy; ctx.lineWidth = 2.5; ctx.stroke();
  // 무늬 라인
  ctx.strokeStyle = COLOR.red; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-bw / 2 + 4, -4); ctx.lineTo(bw / 2 - 4, -4); ctx.stroke();

  // 쌓인 재료
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const show = stack.slice(-6);
  show.forEach((em, i) => {
    const ox = ((i % 3) - 1) * 20;
    const oy = -14 - Math.floor(i / 3) * 14;
    ctx.font = '20px sans-serif';
    ctx.fillText(em, ox, oy);
  });

  // 그릇 테두리(입구) — 재료 위에 살짝 겹치게
  ctx.fillStyle = COLOR.white;
  ctx.strokeStyle = COLOR.navy; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, -14, bw / 2, 8, 0, 0, Math.PI); ctx.stroke();
  ctx.restore();
}

function drawItem(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(it.rot * 0.3);
  const r = CFG.itemRadius;
  const isTrap = it.kind === 'trap';

  // 접시 원판 (황금 재료는 반짝이는 금색)
  if (it.golden) { ctx.shadowColor = '#f5c542'; ctx.shadowBlur = 16; }
  ctx.fillStyle = isTrap ? 'rgba(200,80,60,0.12)' : it.golden ? '#ffe9a8' : 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = isTrap ? COLOR.red : it.golden ? '#d4a017' : COLOR.orange;
  if (isTrap) ctx.setLineDash([5, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '26px sans-serif';
  ctx.fillText(isTrap ? it.trap.emoji : ING[it.id].emoji, 0, -1);
  if (it.golden) { ctx.font = '13px sans-serif'; ctx.fillText('✨', r - 8, -r + 8); }

  // 라벨 (메뉴 학습 포인트)
  ctx.rotate(-it.rot * 0.3);
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = isTrap ? COLOR.red : it.golden ? '#b8860b' : COLOR.navy;
  const label = isTrap ? it.trap.name : ING[it.id].name;
  ctx.fillText(label, 0, r + 9);
  ctx.restore();
}

function drawOrderPanel() {
  const menu = currentMenu();
  const recipe = curRecipe;
  const px = 12, py = 70, pw = W - 24;
  const chipR = 15, gap = 8;
  const ph = 74;

  // 주문서 종이
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.94)';
  rr(px, py, pw, ph, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(30,42,56,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  // 집게
  ctx.fillStyle = COLOR.red;
  rr(W / 2 - 16, py - 5, 32, 10, 4); ctx.fill();

  // 메뉴명
  ctx.fillStyle = COLOR.navy;
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('📋 ' + menu.name, px + 12, py + 22);
  ctx.font = '11px sans-serif';
  ctx.fillStyle = COLOR.navy2;
  ctx.textAlign = 'right';
  ctx.fillText((round > 0 ? round + 1 + '바퀴째 · ' : '') + '메뉴 ' + (menuIdx + 1) + '/' + MENUS.length, px + pw - 12, py + 22);

  // 재료 순서 칩
  const totalW = recipe.length * chipR * 2 + (recipe.length - 1) * gap;
  let cx = W / 2 - totalW / 2 + chipR;
  const cy = py + 46;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  recipe.forEach((id, i) => {
    const done = i < stepIdx, cur = i === stepIdx;
    // 화살표
    if (i > 0) {
      ctx.fillStyle = 'rgba(30,42,56,0.35)';
      ctx.font = '10px sans-serif';
      ctx.fillText('▶', cx - chipR - gap / 2, cy);
    }
    // 칩 배경
    ctx.beginPath(); ctx.arc(cx, cy, chipR, 0, Math.PI * 2);
    ctx.fillStyle = done ? 'rgba(140,190,120,0.3)' : cur ? 'rgba(240,168,60,0.28)' : 'rgba(30,42,56,0.06)';
    ctx.fill();
    if (cur) {
      const pulse = 2 + Math.sin(playTime * 6) * 1.5;
      ctx.lineWidth = 3;
      ctx.strokeStyle = COLOR.orange;
      ctx.beginPath(); ctx.arc(cx, cy, chipR + pulse, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = done ? 0.5 : 1;
    ctx.font = '17px sans-serif';
    ctx.fillText(ING[id].emoji, cx, cy);
    ctx.globalAlpha = 1;
    if (done) {
      ctx.fillStyle = '#4a8a3c';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('✓', cx + chipR - 5, cy - chipR + 6);
    }
    cx += chipR * 2 + gap;
  });
  ctx.restore();

  // "지금 받을 재료" 안내
  const need = ING[neededIngId()];
  ctx.save();
  ctx.font = 'bold 12px sans-serif';
  const label = isFever()
    ? '🔥 FEVER!! 아무 재료나 OK!! (함정 빼고)'
    : '지금 받을 것 ▶ ' + need.emoji + ' ' + need.name;
  const bw2 = ctx.measureText(label).width + 28;
  const by = py + ph + 8;
  ctx.fillStyle = isFever() ? COLOR.red : COLOR.navy;
  rr(W / 2 - bw2 / 2, by, bw2, 24, 12); ctx.fill();
  ctx.fillStyle = COLOR.cream;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, W / 2, by + 12 + Math.sin(playTime * 6) * 0.8);
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  // 점수
  ctx.fillStyle = COLOR.navy;
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('점수 ' + score, 12, 56);
  // 하트
  ctx.textAlign = 'right';
  ctx.font = '15px sans-serif';
  let hearts = '';
  for (let i = 0; i < CFG.maxLives; i++) hearts = (i < lives ? '❤️' : '🖤') + hearts;
  ctx.fillText(hearts, W - 12, 56);

  // 손님 인내심 게이지 (가운데)
  const ratio = Math.max(0, patience / patienceMax);
  const gw = 96, gh = 12, gx = W / 2 - gw / 2, gy = 50;
  const face = ratio > 0.6 ? '🙂' : ratio > 0.3 ? '😠' : '🤬';
  ctx.textAlign = 'right'; ctx.font = '15px sans-serif';
  ctx.fillText(face, gx - 4, 56);
  ctx.fillStyle = 'rgba(30,42,56,0.15)';
  rr(gx, gy, gw, gh, 6); ctx.fill();
  if (ratio > 0.003) {
    const flash = ratio < 0.3 && Math.floor(playTime * 6) % 2 === 0;
    ctx.fillStyle = ratio > 0.5 ? '#7cb15c' : ratio > 0.3 ? COLOR.orange : flash ? '#ff2d1a' : COLOR.red;
    rr(gx, gy, Math.max(6, gw * ratio), gh, 6); ctx.fill();
  }
  ctx.restore();
}

function drawCustomer() {
  if (!customer) return;
  const ratio = Math.max(0, patience / patienceMax);
  const cx = 46, cy = 272;
  const shake = ratio < 0.32 ? Math.sin(playTime * 30) * 1.5 : 0;

  ctx.save();
  ctx.translate(cx + shake, cy);
  // 프로필 원 (테두리 = 인내심 신호등)
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 3;
  const flash = ratio < 0.3 && Math.floor(playTime * 6) % 2 === 0;
  ctx.strokeStyle = ratio > 0.5 ? '#7cb15c' : ratio > 0.3 ? COLOR.orange : flash ? '#ff2d1a' : COLOR.red;
  ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '28px sans-serif';
  ctx.fillText(customer.face, 0, 1);
  if (ratio < 0.32) { ctx.font = '14px sans-serif'; ctx.fillText('💢', 21, -20); }
  // 이름표
  ctx.font = 'bold 9px sans-serif';
  const label = customer.short || customer.name;
  const nw = Math.min(ctx.measureText(label).width + 12, 88);
  ctx.fillStyle = COLOR.navy;
  rr(-nw / 2, 30, nw, 15, 7); ctx.fill();
  ctx.fillStyle = COLOR.cream;
  ctx.fillText(label, 0, 38, nw - 8);
  ctx.restore();

  // 말풍선
  if (bubble) {
    const p = bubble.t / bubble.dur;
    const alpha = p < 0.12 ? p / 0.12 : p > 0.8 ? (1 - p) / 0.2 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 12px sans-serif';
    const tw = ctx.measureText(bubble.text).width;
    const bx = 74, bw = Math.min(tw + 22, W - bx - 8), bh = 30;
    const by = cy - 15;
    ctx.fillStyle = 'rgba(255,255,255,0.97)';
    rr(bx, by, bw, bh, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(30,42,56,0.25)'; ctx.lineWidth = 1.5;
    rr(bx, by, bw, bh, 10); ctx.stroke();
    // 꼬리 (손님 쪽)
    ctx.fillStyle = 'rgba(255,255,255,0.97)';
    ctx.beginPath();
    ctx.moveTo(bx + 1, by + 10);
    ctx.lineTo(bx - 7, by + 15);
    ctx.lineTo(bx + 1, by + 20);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = COLOR.navy;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(bubble.text, bx + 11, by + 15, bw - 20);
    ctx.restore();
  }
}

function drawCombo() {
  if (combo < 2) return;
  const fever = combo >= CFG.feverCombo;
  const pop = 1 + Math.max(0, comboPop) * 0.9;
  ctx.save();
  ctx.translate(W - 54, 196);
  ctx.scale(pop, pop);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 27px sans-serif';
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.fillStyle = fever ? COLOR.red : COLOR.orange;
  ctx.strokeText('x' + comboMult(), 0, 0);
  ctx.fillText('x' + comboMult(), 0, 0);
  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = COLOR.navy;
  ctx.fillText(combo + ' COMBO', 0, 19);
  if (fever) {
    ctx.fillStyle = COLOR.red;
    ctx.fillText('🔥 FEVER!', 0, 35);
  }
  ctx.restore();
}

function drawEventBanner() {
  if (!evt) return;
  const E = EVT_INFO[evt.type];
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (evt.phase === 'warn') {
    const flash = Math.floor(evt.t * 8) % 2 === 0;
    ctx.font = 'bold 16px sans-serif';
    const text = '⚠ ' + E.warn;
    const tw = ctx.measureText(text).width + 40;
    const by = H * 0.3;
    ctx.fillStyle = flash ? COLOR.red : COLOR.navy;
    rr(W / 2 - tw / 2, by - 22, tw, 44, 12); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(text, W / 2, by);
  } else if (E.active) {
    ctx.font = 'bold 12px sans-serif';
    const tw = ctx.measureText(E.active).width + 30;
    const by = 212;
    ctx.fillStyle = 'rgba(200,80,60,0.92)';
    rr(W / 2 - tw / 2, by, tw, 24, 12); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(E.active, W / 2, by + 11);
    // 남은 시간 바
    const rem = Math.max(0, 1 - evt.t / evt.dur);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    rr(W / 2 - tw / 2 + 8, by + 19, (tw - 16) * rem, 3, 1.5); ctx.fill();
  }
  ctx.restore();
}

function drawBlackout() {
  if (!evtOn('blackout')) return;
  // 하치 주변만 손전등처럼 보인다
  const cx = hachi.x, cy = hachiBaseY() - 120;
  const g = ctx.createRadialGradient(cx, cy, 40, cx, cy, 250);
  g.addColorStop(0, 'rgba(5,8,14,0.2)');
  g.addColorStop(1, 'rgba(5,8,14,0.94)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawFever() {
  if (combo < CFG.feverCombo) return;
  const a = 0.16 + Math.sin(playTime * 8) * 0.06;
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.72);
  g.addColorStop(0, 'rgba(240,168,60,0)');
  g.addColorStop(1, 'rgba(200,80,60,' + a + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawToasts() {
  toasts.forEach(t => {
    const p = t.t / t.dur;
    const alpha = p < 0.15 ? p / 0.15 : p > 0.75 ? (1 - p) / 0.25 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (t.big) {
      // 말풍선 스타일 실패 멘트 (화면 밖으로 넘치지 않게)
      ctx.font = 'bold 15px sans-serif';
      const tw = Math.min(ctx.measureText(t.text).width, W - 44);
      const bx = W / 2 - tw / 2 - 14, by = t.y - 20, bw = tw + 28, bh = 40;
      ctx.fillStyle = 'rgba(255,255,255,0.96)';
      rr(bx, by, bw, bh, 12); ctx.fill();
      ctx.strokeStyle = t.color; ctx.lineWidth = 2.5;
      rr(bx, by, bw, bh, 12); ctx.stroke();
      ctx.fillStyle = t.color;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.text, W / 2, t.y, tw);
    } else {
      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = t.color;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.text, t.x, t.y - p * 24);
    }
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = 1 - p.t / p.dur;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function drawClearOverlay() {
  const p = Math.min(1, clearTimer / 0.35);
  ctx.save();
  ctx.fillStyle = 'rgba(30,42,56,' + 0.55 * p + ')';
  ctx.fillRect(0, 0, W, H);

  // 완성된 그릇이 위로 서빙되는 연출
  if (serveAnim) {
    const sy = serveAnim.y - serveAnim.t * 120;
    drawBowl(serveAnim.x, sy, serveAnim.stack);
  }

  const cy = H * 0.4;
  ctx.globalAlpha = p;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // 손님 얼굴이 감동한다
  ctx.font = (clearInfo.final ? 40 : 44) + 'px sans-serif';
  ctx.fillText('🎉 ' + (clearInfo.face || '') + ' 🎉', W / 2, cy - 66);
  ctx.fillStyle = COLOR.cream;
  ctx.font = 'bold ' + (clearInfo.final ? 24 : 28) + 'px sans-serif';
  ctx.fillText(clearInfo.name + ' 완성!', W / 2, cy);
  ctx.fillStyle = COLOR.orange;
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('"' + clearInfo.sub + '"', W / 2, cy + 34, W - 40);
  if (clearInfo.custName) {
    ctx.fillStyle = 'rgba(245,239,224,0.85)';
    ctx.font = '11px sans-serif';
    ctx.fillText('— ' + clearInfo.custName + ' 손님 —', W / 2, cy + 54);
  }
  ctx.fillStyle = 'rgba(245,239,224,0.75)';
  ctx.font = '13px sans-serif';
  ctx.fillText('완성 +' + clearInfo.bonus + '점 · 서비스 보너스 +' + clearInfo.serviceBonus + '점', W / 2, cy + 78);
  ctx.fillText('속도가 빨라진다!', W / 2, cy + 96);
  ctx.restore();
}

function drawTitle() {
  drawBackground();
  ctx.save();

  // 로고
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = COLOR.navy;
  ctx.font = 'bold 34px sans-serif';
  ctx.fillText('하치 주방 캐치', W / 2, H * 0.17);
  ctx.fillStyle = COLOR.red;
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('— HACHIRO 하치로 —', W / 2, H * 0.17 + 32);

  // 하치 (가운데서 대기, 살랑살랑)
  hachi.x = hachi.targetX = W / 2 + Math.sin(playTime * 1.2) * 10;
  drawHachi();

  // 떨어지는 데코 이모지
  ctx.font = '22px sans-serif';
  ['🍚', '🥓', '🧀', '🦐', '🥚'].forEach((em, i) => {
    const yy = ((playTime * 40 + i * 130) % (H * 0.5));
    ctx.globalAlpha = 0.5;
    ctx.fillText(em, 40 + i * ((W - 80) / 4), H * 0.22 + yy * 0.6);
  });
  ctx.globalAlpha = 1;

  // 설명 카드
  const cardY = H * 0.36;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  rr(30, cardY, W - 60, 118, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(30,42,56,0.2)'; ctx.lineWidth = 1.5;
  rr(30, cardY, W - 60, 118, 14); ctx.stroke();
  ctx.fillStyle = COLOR.navy;
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('알바생 하치의 첫 출근!', W / 2, cardY + 24);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = COLOR.navy2;
  ctx.fillText('드래그로 주문서 순서대로 재료 캐치!', W / 2, cardY + 50);
  ctx.fillText('손님 인내심이 다 닳기 전에 완성하라!', W / 2, cardY + 70);
  ctx.fillStyle = COLOR.red;
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('🧦 함정 주의!! 콤보를 이으면 점수 폭발 🔥', W / 2, cardY + 98);

  // 시작 버튼
  const btnY = H * 0.36 + 140;
  const pulse = 1 + Math.sin(playTime * 4) * 0.03;
  ctx.save();
  ctx.translate(W / 2, btnY + 26);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = COLOR.orange;
  rr(-90, -26, 180, 52, 26); ctx.fill();
  ctx.fillStyle = COLOR.navy;
  ctx.font = 'bold 19px sans-serif';
  ctx.fillText('출근하기 🐕', 0, 1);
  ctx.restore();

  if (bestScore > 0) {
    ctx.fillStyle = COLOR.navy2;
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('🏆 최고 기록 ' + bestScore + '점', W / 2, btnY + 74);
  }

  ctx.fillStyle = 'rgba(30,42,56,0.45)';
  ctx.font = '11px sans-serif';
  ctx.fillText('일본식 돈부리 하치로 · 서현점 / 미금점', W / 2, H - 20);
  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(30,42,56,0.86)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const y = Math.max(52, H * 0.07);
  ctx.font = '30px sans-serif';
  ctx.fillText('🍜', W / 2, y);
  ctx.fillStyle = COLOR.cream;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('영업 종료!', W / 2, y + 36);
  ctx.fillStyle = 'rgba(245,239,224,0.75)';
  ctx.font = '12px sans-serif';
  ctx.fillText(gameOverLine, W / 2, y + 60);

  // 배달앱 리뷰 패널
  const px = 24, pw = W - 48;
  const headH = 58, revH = 54, statH = 62;
  const ph = headH + reviews.length * revH + statH;
  const py = y + 80;
  ctx.fillStyle = 'rgba(245,239,224,0.97)';
  rr(px, py, pw, ph, 14); ctx.fill();

  // 앱 헤더 + 가게 정보
  ctx.textAlign = 'left';
  ctx.fillStyle = COLOR.navy2;
  ctx.font = 'bold 11px sans-serif';
  ctx.fillText('📱 돈부리의민족 — 리뷰 ' + reviews.length + '개', px + 14, py + 17);
  ctx.fillStyle = COLOR.navy;
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('하치로 서현·미금점', px + 14, py + 39);
  const avg = reviews.length ? reviews.reduce((s, r) => s + r.stars, 0) / reviews.length : 0;
  ctx.textAlign = 'right';
  ctx.fillStyle = COLOR.orange;
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('★ ' + avg.toFixed(1), px + pw - 14, py + 39);
  ctx.strokeStyle = 'rgba(30,42,56,0.12)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px + 10, py + headH); ctx.lineTo(px + pw - 10, py + headH); ctx.stroke();

  // 리뷰 카드들
  reviews.forEach((r, i) => {
    const ry = py + headH + i * revH;
    ctx.textAlign = 'left';
    ctx.fillStyle = COLOR.navy;
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(r.name, px + 14, ry + 15);
    ctx.fillStyle = COLOR.orange;
    ctx.fillText('★'.repeat(r.stars) + '☆'.repeat(5 - r.stars), px + 14 + ctx.measureText(r.name).width + 10, ry + 15);
    ctx.fillStyle = COLOR.navy2;
    ctx.font = '12px sans-serif';
    ctx.fillText('"' + r.text + '"', px + 14, ry + 36);
    ctx.strokeStyle = 'rgba(30,42,56,0.08)';
    ctx.beginPath(); ctx.moveTo(px + 10, ry + revH); ctx.lineTo(px + pw - 10, ry + revH); ctx.stroke();
  });

  // 오늘 장사 결산
  const sy = py + headH + reviews.length * revH;
  ctx.textAlign = 'center';
  ctx.fillStyle = COLOR.navy;
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('오늘 매출 ' + score.toLocaleString() + '원 · ' + menusDone + '그릇 · 최고 ' + maxCombo + '콤보', W / 2, sy + 24);
  ctx.fillStyle = score >= bestScore && score > 0 ? COLOR.red : COLOR.navy2;
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('🏆 최고 기록 ' + bestScore.toLocaleString() + '원' + (score >= bestScore && score > 0 ? ' — 신기록!!' : ''), W / 2, sy + 45);

  // 다시하기
  if (overTimer > 0.6) {
    const btnY = py + ph + 20;
    const pulse = 1 + Math.sin(overTimer * 4) * 0.03;
    ctx.save();
    ctx.translate(W / 2, btnY + 24);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = COLOR.orange;
    rr(-85, -24, 170, 48, 24); ctx.fill();
    ctx.fillStyle = COLOR.navy;
    ctx.textAlign = 'center';
    ctx.font = 'bold 17px sans-serif';
    ctx.fillText('다시 출근하기 💪', 0, 1);
    ctx.restore();
  }
  ctx.restore();
}

function render() {
  ctx.save();
  // 화면 흔들림
  if (shakeT > 0) {
    const s = shakeT * 14;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  if (scene === 'title') {
    drawTitle();
    drawToasts();
    ctx.restore();
    return;
  }

  drawBackground();
  drawFever();
  items.forEach(drawItem);
  drawHachi();
  drawBlackout();
  drawOrderPanel();
  drawHUD();
  drawCustomer();
  drawCombo();
  drawEventBanner();
  drawParticles();
  drawToasts();

  if (scene === 'clear') drawClearOverlay();
  if (scene === 'over') drawGameOver();
  ctx.restore();
}

/* ============================================================
 * 메인 루프
 * ============================================================ */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
