name: Deploy game to GitHub Pages

on:
  push:
    branches: [claude/voice-integration-deploy-l01vyq]
    paths:
      - hachipronounce.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish game to gh-pages branch
        run: |
          cp hachipronounce.html /tmp/game.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp /tmp/game.html hachipronounce.html
          cp /tmp/game.html index.html
          git add hachipronounce.html index.html
          git commit -m "Update game from ${GITHUB_SHA::7}" || echo "no changes"
          git push origin gh-pages
